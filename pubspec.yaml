name: workpulse
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.0.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  supabase_flutter: ^2.14.1
  uuid: ^4.5.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  share_plus: ^10.1.4
  flutter_local_notifications: 17.2.2
  shared_preferences: ^2.2.0
  firebase_core: ^2.32.0
  firebase_crashlytics: ^3.5.0
  geolocator: ^13.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  syncfusion_flutter_pdfviewer: ^33.2.13
  hand_signature: ^3.1.0+2
  syncfusion_flutter_pdf: ^33.2.13
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  freezed: ^3.1.0
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true

  assets:
    - .env
  fonts:
   - family: ArabicPdf
     fonts:
       - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
       - asset: assets/fonts/pt-bold-heading.ttf
         weight: 700